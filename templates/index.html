<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WE SELL TIME · 5 Minutes Experience</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --accent-success: #22c55e;
            --accent-error: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        .container { width: 100%; max-width: 600px; background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 32px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); display: flex; flex-direction: column; gap: 24px; position: relative; }
        header { text-align: center; border-bottom: 1px solid var(--border-color); padding-bottom: 16px; position: relative; }
        header h1 { font-size: 1.5rem; letter-spacing: 2px; color: var(--accent); text-transform: uppercase; }
        header p { font-size: 0.9rem; color: var(--text-muted); margin-top: 4px; }
        .top-controls { position: absolute; top: 0; right: 0; display: flex; gap: 8px; }
        .icon-btn { background: rgba(56, 189, 248, 0.1); border: 1px solid var(--accent); color: var(--accent); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 0.8rem; font-weight: bold; }
        .icon-btn:hover { background: var(--accent); color: var(--bg-color); }
        .timer-bar-container { width: 100%; background-color: var(--border-color); height: 6px; border-radius: 3px; overflow: hidden; }
        .timer-bar { width: 100%; height: 100%; background-color: var(--accent); transition: width 1s linear; }
        .badge-row { display: flex; justify-content: space-between; align-items: center; }
        .badge { font-size: 0.75rem; text-transform: uppercase; padding: 4px 10px; border-radius: 12px; background-color: rgba(56, 189, 248, 0.1); color: var(--accent); border: 1px solid var(--accent); letter-spacing: 1px; }
        .question-text { font-size: 1.25rem; line-height: 1.6; font-weight: 500; }
        .options-grid { display: flex; flex-direction: column; gap: 12px; }
        .option-btn { background-color: rgba(255, 255, 255, 0.03); border: 1px solid var(--border-color); color: var(--text-main); padding: 14px 18px; border-radius: 8px; font-size: 1rem; text-align: left; cursor: pointer; transition: all 0.2s ease; }
        .option-btn:hover { background-color: rgba(56, 189, 248, 0.1); border-color: var(--accent); }
        .feedback-card { display: none; background-color: rgba(255, 255, 255, 0.02); border-left: 4px solid var(--accent); padding: 16px; border-radius: 4px; font-size: 0.95rem; line-height: 1.5; }
        .feedback-card.correct { border-left-color: var(--accent-success); }
        .feedback-card.incorrect { border-left-color: var(--accent-error); }
        .action-btn { background-color: var(--accent); color: var(--bg-color); border: none; padding: 14px; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; width: 100%; text-align: center; }
        .hidden { display: none !important; }
        .completion-screen { text-align: center; display: flex; flex-direction: column; gap: 16px; }
        .completion-screen h2 { font-size: 1.8rem; color: var(--accent); }
        .completion-screen p { color: var(--text-muted); line-height: 1.6; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>WE SELL TIME</h1>
        <p id="sub-title">5 MINUTES. A DIFFERENT PERSPECTIVE.</p>
        <div class="top-controls">
            <button class="icon-btn" onclick="toggleLanguage()" id="lang-btn">ES</button>
        </div>
    </header>

    <div id="start-view" class="completion-screen">
        <h2 id="welcome-h2">Ready for your 5-minute break?</h2>
        <p id="welcome-p">Engage in an orderly sequence across our four core libraries.</p>
        <button class="action-btn" onclick="startSession()" id="start-btn">Start Experience</button>
    </div>

    <div id="session-view" class="hidden" style="display: flex; flex-direction: column; gap: 20px;">
        <div class="timer-bar-container"><div id="timer-bar" class="timer-bar"></div></div>
        <div class="badge-row">
            <div id="category-badge" class="badge">Category</div>
            <button class="icon-btn" onclick="speakCurrentCard()" title="Listen">🔊 Listen</button>
        </div>
        <div id="prompt-text" class="question-text">Loading content...</div>
        <div id="options-container" class="options-grid"></div>
        <div id="feedback-card" class="feedback-card">
            <strong id="feedback-status"></strong>
            <p id="feedback-explanation" style="margin-top: 6px;"></p>
            <p id="feedback-takeaway" style="margin-top: 8px; color: var(--accent); font-style: italic;"></p>
        </div>
        <button id="next-btn" class="action-btn hidden" onclick="loadNextCard()">Continue</button>
    </div>

    <div id="end-view" class="completion-screen hidden">
        <h2 id="end-h2">Time Complete</h2>
        <p id="end-p">You have taken 5 minutes to think and reflect.</p>
        <button class="action-btn" onclick="resetToHome()" id="home-btn">Return Home</button>
    </div>
</div>

<script>
    let remainingTime = 300;
    let timerInterval = null;
    let currentIndices = {
        "Riddles & Discoveries": 0,
        "Real-Life Situations": 0,
        "Everyday Math & Problem Solving": 0,
        "Human Needs & Positive Perspectives": 0
    };
    let currentCardData = null;
    let currentLang = 'en'; // Default English

    const translations = {
        en: {
            subTitle: "5 MINUTES. A DIFFERENT PERSPECTIVE.",
            langBtn: "ES",
            welcomeH2: "Ready for your 5-minute break?",
            welcomeP: "Engage in an orderly sequence across our four core libraries.",
            startBtn: "Start Experience",
            endH2: "Time Complete",
            endP: "You have taken 5 minutes to think and reflect. Carry this perspective with you today.",
            homeBtn: "Return Home",
            continueBtn: "Continue",
            correct: "Correct",
            incorrect: "Incorrect. Correct answer: "
        },
        es: {
            subTitle: "5 MINUTOS. UNA PERSPECTIVA DIFERENTE.",
            langBtn: "EN",
            welcomeH2: "¿Listo para tu pausa de 5 minutos?",
            welcomeP: "Participa en una secuencia ordenada a través de nuestras cuatro bibliotecas principales.",
            startBtn: "Comenzar Experiencia",
            endH2: "Tiempo Completado",
            endP: "Te has tomado 5 minutos para pensar y reflexionar. Lleva esta perspectiva contigo hoy.",
            homeBtn: "Volver al Inicio",
            continueBtn: "Continuar",
            correct: "Correcto",
            incorrect: "Incorrecto. Respuesta correcta: "
        }
    };

    function toggleLanguage() {
        currentLang = currentLang === 'en' ? 'es' : 'en';
        updateUIStaticTexts();
        if (currentCardData) renderCard();
    }

    function updateUIStaticTexts() {
        const t = translations[currentLang];
        document.getElementById('sub-title').innerText = t.subTitle;
        document.getElementById('lang-btn').innerText = t.langBtn;
        document.getElementById('welcome-h2').innerText = t.welcomeH2;
        document.getElementById('welcome-p').innerText = t.welcomeP;
        document.getElementById('start-btn').innerText = t.startBtn;
        document.getElementById('end-h2').innerText = t.endH2;
        document.getElementById('end-p').innerText = t.endP;
        document.getElementById('home-btn').innerText = t.homeBtn;
        document.getElementById('next-btn').innerText = t.continueBtn;
    }

    function startSession() {
        document.getElementById('start-view').classList.add('hidden');
        document.getElementById('session-view').classList.remove('hidden');
        document.getElementById('end-view').classList.add('hidden');
        
        remainingTime = 300;
        updateTimerBar();

        timerInterval = setInterval(() => {
            remainingTime--;
            updateTimerBar();
            if (remainingTime <= 0) endSession();
        }, 1000);

        loadNextCard();
    }

    function updateTimerBar() {
        document.getElementById('timer-bar').style.width = (remainingTime / 300) * 100 + '%';
    }

    async function loadNextCard() {
        document.getElementById('feedback-card').style.display = 'none';
        document.getElementById('next-btn').classList.add('hidden');
        document.getElementById('options-container').innerHTML = '';

        try {
            const response = await fetch('/api/next-card', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ indices: currentIndices })
            });

            if (!response.ok) { endSession(); return; }

            currentCardData = await response.json();
            currentIndices = currentCardData.next_indices;
            renderCard();
        } catch (error) {
            console.error("Error:", error);
        }
    }

    function renderCard() {
        const card = currentCardData[currentLang];
        document.getElementById('category-badge').innerText = currentCardData.category;
        document.getElementById('prompt-text').innerText = card.prompt;

        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';
        card.options.forEach((opt) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => selectOption(opt);
            optionsContainer.appendChild(btn);
        });
    }

    function selectOption(selectedOpt) {
        const card = currentCardData[currentLang];
        document.querySelectorAll('.option-btn').forEach(btn => btn.disabled = true);
        const isCorrect = selectedOpt === card.correct_answer;
        const feedbackCard = document.getElementById('feedback-card');
        const t = translations[currentLang];
        
        feedbackCard.style.display = 'block';
        feedbackCard.className = `feedback-card ${isCorrect ? 'correct' : 'incorrect'}`;
        document.getElementById('feedback-status').innerText = isCorrect ? t.correct : `${t.incorrect}${card.correct_answer}`;
        document.getElementById('feedback-explanation').innerText = card.explanation;
        document.getElementById('feedback-takeaway').innerText = `Key Takeaway: ${card.takeaway}`;
        document.getElementById('next-btn').classList.remove('hidden');
    }

    function speakCurrentCard() {
        if (!currentCardData) return;
        const card = currentCardData[currentLang];
        const textToSpeak = `${card.prompt}. Options are: ${card.options.join(', ')}`;
        
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(textToSpeak);
            utterance.lang = currentLang === 'es' ? 'es-ES' : 'en-US';
            utterance.rate = 1.0;
            window.speechSynthesis.speak(utterance);
        }
    }

    function endSession() {
        clearInterval(timerInterval);
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        document.getElementById('session-view').classList.add('hidden');
        document.getElementById('end-view').classList.remove('hidden');
    }

    function resetToHome() {
        document.getElementById('end-view').classList.add('hidden');
        document.getElementById('start-view').classList.add('hidden');
        document.getElementById('start-view').classList.remove('hidden');
    }
</script>
</body>
</html>
